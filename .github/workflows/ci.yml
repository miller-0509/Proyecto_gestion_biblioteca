name: CI/CD Pipeline - Flask Gestión Biblioteca

on:
  push:
    branches:
      - main
      - develop
      - master
  pull_request:
    branches:
      - main
      - develop
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. LINT & CALIDAD DE CÓDIGO
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Code Style (Ruff & Flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de linting
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Ejecutar linter Ruff
        run: |
          ruff check .

      - name: Ejecutar Flake8 (análisis de sintaxis y complejidad)
        run: |
          # Falla si existen errores de sintaxis o variables no definidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de estilo con límite de complejidad ciclomática
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  # ──────────────────────────────────────────────────────────────────────────
  # 2. PRUEBAS AUTOMATIZADAS Y COBERTURA (PYTEST)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      FLASK_ENV: testing
      SECRET_KEY: test-ci-secret-key-12345

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias de producción y desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar suite de pruebas con Pytest y Cobertura
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Guardar reporte de cobertura como Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 3. CONSTRUCCIÓN Y VALIDACIÓN DE CONTENEDORES DOCKER
  # ──────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validar sintaxis de docker-compose
        run: |
          # Simular variables de entorno para la validación estática de compose
          export SECRET_KEY="dummy-test-key"
          export DATABASE_URL="postgresql://user:pass@localhost:5432/testdb"
          docker compose config --quiet

      - name: Construir imagen Docker (Smoke Test de Build)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: biblioteca-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
