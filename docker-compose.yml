version: "3.8"

services:
  web:
    build: .
    ports:
      - "81:8000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-clave-super-secreta-cambiar-en-produccion}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - db_data:/app/instance
      - log_data:/app/logs
    restart: unless-stopped
    networks:
      - coolify


volumes:
  db_data:
  log_data:

networks:
  coolify:
    external: true