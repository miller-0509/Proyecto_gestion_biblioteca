version: "3.8"

services:
  web:
    build: .
    container_name: biblioteca_app
    ports:
      - "81:81"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-clave-super-secreta-cambiar-en-produccion}
      - DATABASE_URL=sqlite:///almacendb.sqlite
    volumes:
      # Persistir la base de datos SQLite fuera del contenedor
      - db_data:/app/instance
      # Persistir logs
      - log_data:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:81/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db_data:
    driver: local
  log_data:
    driver: local
